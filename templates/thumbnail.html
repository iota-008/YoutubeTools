{% extends "base.html" %} {%block title%} Download Thumbnail {%endblock%}
{%block main%}

<div class="container">
	<img src="{{url}}" alt="Thumbnail Image" />
</div>
<br />
<div id="thumbnail">
	<a
		class="btn btn-primary btn-lg btn3d"
		href="{{ url }}"
		target="_blank"
		rel="noopener noreferrer"
	>
		<span class="glyphicon glyphicon-download-alt">Open Thumbnail</span>
	</a>
</div>

{%endblock%}
