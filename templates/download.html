{% extends "base.html" %}
{% block title %} Video Stream Selector {% endblock %}
{%block main%}

<section class="surface-card">
    <h1>Video Stream Selector</h1>
    <p class="section-subtitle">Choose the stream quality and open the direct media URL.</p>

    {% for option in stream_options %}
    <form method="post" action="{{ url_for('video_quality') }}" class="stream-form">
        <input type="hidden" name="url" value="{{ url }}" />
        <input type="hidden" name="itag" value="{{ option['itag'] }}" />
        <input type="hidden" name="source" value="{{ option['source'] }}" />
        <input type="hidden" name="direct_url" value="{{ option['direct_url'] }}" />
        <button class="material-btn full-btn">
            Open {{ option['resolution'] }} · {{ option['mime_type'] }}
            {% if option['fps'] %} · {{ option['fps'] }}fps{% endif %}
            {% if option['size_mb'] %} · {{ option['size_mb'] }} MB{% endif %}
        </button>
    </form>
    {% endfor %}
</section>

{% endblock %}
