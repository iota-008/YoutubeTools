<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="description"
			content="YouTube Tools Hub: transcript extraction, thumbnails, stream selection, SEO optimizer, channel audit, and idea generation."
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, shrink-to-fit=no"
		/>
		<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
		/>
		<link
			rel="stylesheet"
			type="text/css"
			href="{{ url_for('static', filename='css/style.css') }}"
		/>
		<title>{% block title %}YouTube Tools Hub{% endblock %}</title>
	</head>

	<body>
		<header class="app-header">
			<div class="header-inner">
				<div class="brand-block">
					<a class="brand-link" href="{{ url_for('index') }}">
						<span class="material-icons-outlined">smart_display</span>
						YouTube Tools Hub
					</a>
					<p class="brand-subtitle">Creator workflows in one place</p>
				</div>
				<nav class="header-nav">
					<a class="nav-btn" href="{{ url_for('index') }}">Home</a>
					<a class="nav-btn" href="{{ url_for('history') }}">Run History</a>
				</nav>
			</div>
		</header>
		{% with messages = get_flashed_messages() %}
		{% if messages %}
		<div class="page-shell">
			{% for message in messages %}
			<div class="alert alert-info modern-alert" role="alert">{{ message }}</div>
			{% endfor %}
		</div>
		{% endif %}
		{% endwith %}
		<main class="page-shell">
			{% block main %}{% endblock %}
		</main>

		<div id="global-loader" class="loader-overlay" aria-hidden="true">
			<div class="loader-card" role="status" aria-live="polite">
				<div class="loader-spinner"></div>
			</div>
		</div>

		<script
			src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
			integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
			crossorigin="anonymous"
		></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

		<script
			type="text/javascript"
			src="{{ url_for('static', filename='js/main.js') }}"
		></script>
	</body>
</html>
