{% extends "base.html" %}
{% block title %} Transcript Extractor {% endblock %}
{% block main %}

<section class="surface-card">
    <h1>Transcript Extractor</h1>
    <p class="section-subtitle">Review, copy, or download transcript text as a file.</p>

    <textarea rows="20" id="transcript" class="material-textarea">{{ transcript_text }}</textarea>
    <div class="action-row mt-3">
        <button id="dload" onclick="dload()" class="material-btn">Download Transcript</button>
    </div>
</section>

{% endblock %}
